<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Suscripción</title>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;color:#1b2240;font-family:Arial,Helvetica,sans-serif;padding:16px;box-sizing:border-box">
<div style="max-width:440px;width:100%;padding:36px 28px;text-align:center;background:#fff;border:1px solid #e3e7f2;border-radius:16px;box-shadow:0 8px 30px rgba(20,30,60,.08)">
<div id="i" style="font-size:40px;line-height:1;margin-bottom:12px">✅</div>
<h1 id="t" style="font-size:22px;margin:0 0 10px">Listo, ya no recibirás más correos</h1>
<p id="p" style="line-height:1.55;color:#4a5275;margin:0">Te dimos de baja de nuestra lista. Gracias por avisarnos y disculpa la molestia.</p>
</div>
<script>
if (new URLSearchParams(location.search).get("ok") !== "1") {
  document.getElementById("i").textContent = "⚠️";
  document.getElementById("t").textContent = "No pudimos confirmar tu baja";
  document.getElementById("p").textContent = "El enlace no es válido o está incompleto. Para darte de baja, responde al correo con la palabra BAJA y te retiramos de la lista.";
}
</script>
</body>
</html>
